<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture Library - The Life Experience</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        html { scroll-behavior: smooth; height: auto !important; overflow-y: scroll !important; }
        body { font-family: 'Courier New', Courier, monospace, 'Segoe UI'; background-color: #000000; color: #ffffff; margin: 0; padding: 0; letter-spacing: 1px; height: auto !important; min-height: 100%; }
        .container { width: 80%; margin: auto; max-width: 1200px; position: relative; z-index: 5; }
        .hero-watermark { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 450px; height: auto; opacity: 0.05; pointer-events: none; z-index: 0; }
        header { background-color: rgba(0, 0, 0, 0.95); padding: 30px 0; border-bottom: 1px solid #1a1a1a; position: relative; z-index: 100; }
        .navbar { display: flex; justify-content: space-between; align-items: center; }
        .logo-area { display: flex; align-items: center; gap: 15px; text-decoration: none; color: #fff; }
        .band-main-logo { height: 45px; width: auto; object-fit: contain; }
        .band-name { font-size: 22px; font-weight: bold; text-transform: uppercase; letter-spacing: 3px; }
        .nav-links { list-style: none; display: flex; gap: 25px; margin: 0; padding: 0; }
        .nav-links a { color: #888888; text-decoration: none; font-size: 13px; text-transform: uppercase; transition: 0.4s; }
        .nav-links a:hover { color: #ffffff; text-shadow: 0 0 5px #ffffff; }
        .gallery-section { padding: 60px 0 80px; position: relative; z-index: 5; }
        .gallery-section h1 { font-size: 32px; text-transform: uppercase; letter-spacing: 4px; text-align: center; margin-bottom: 50px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .gallery-item { position: relative; overflow: hidden; border: 1px solid #1a1a1a; height: 280px; background-color: #050505; transition: 0.4s; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; filter: grayscale(100%); }
        .gallery-item:hover { border-color: #ff3333; box-shadow: 0 0 15px rgba(255, 51, 51, 0.2); }
        .gallery-item:hover img { filter: grayscale(0%); transform: scale(1.05); }
        .footer { background-color: #111111; text-align: center; padding: 40px 0; 
    font-size: 11px; /* লেখার সাইজ ছোট করা হলো */
    font-weight: normal !important; /* লেখা যেন একদম চিকন দেখায় */
    color: #888888; /* একটু হালকা ছাই রঙ করা হলো যেন চোখে না লাগে */
    border-top: 1px solid #222222; 
    text-transform: uppercase; 
    letter-spacing: 2px; 
    position: relative; 
    z-index: 10; 
    clear: both; 
}
.footer p {
    font-weight: 300 !important; /* সাফারিতে অতিরিক্ত স্লিম লুক দেওয়ার জন্য */
    margin: 0;
}
.social-icons { 
    margin-bottom: 20px; 
    display: flex; 
    justify-content: center; 
    gap: 30px; 
}
.social-icons a { 
    color: #888888; 
    font-size: 13px; /* আইকন ও টেক্সট লিংক চিকন করা হলো */
    font-weight: normal !important;
    text-decoration: none; 
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: 0.4s; 
}
.social-icons a:hover { 
    color: #ff3333; 
    text-shadow: 0 0 8px rgba(255, 51, 51, 0.6);
}

    </style>
</head>
<body>
    <img src="logo.jpg" alt="Watermark" class="hero-watermark">
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo-area">
                <img src="logo.jpg" alt="Logo" class="band-main-logo">
                <div class="band-name">The Life Experience</div>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#about">Members</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="lyrics.html">Lyrics</a></li>
                    <li><a href="music.html">Music</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <section class="gallery-section">
        <div class="container">
            <h1>Picture Library</h1>
            <div class="gallery-grid">
                <div class="gallery-item"><img src="band_pic1.jpg" alt="Photo 1" onerror="this.src='https://placeholder.com'"></div>
                <div class="gallery-item"><img src="band_pic2.jpg" alt="Photo 2" onerror="this.src='https://placeholder.com'"></div>
                <div class="gallery-item"><img src="band_pic3.jpg" alt="Photo 3" onerror="this.src='https://placeholder.com'"></div>
                <div class="gallery-item"><img src="band_pic4.jpg" alt="Photo 4" onerror="this.src='https://placeholder.com'"></div>
            </div>
        </div>
    </section>
    <footer class="footer">
        <div class="social-icons">
            <a href="https://facebook.com" target="_blank" title="Facebook"><i class="fab fa-facebook-f"></i> Facebook</a>
            <a href="https://instagram.com" target="_blank" title="Instagram"><i class="fab fa-instagram"></i> Instagram</a>
        </div>
        <br>
        <p>Copyright © 2026 The Life Experience. All rights reserved.</p>
    </footer>
</body>
</html>
